<h1>Tag 14 &ndash; Donnerstag, 2. Februar &ndash; Mérida: Pool & Pause</h1>
<h2 class="map-heading">Karte</h2>
<div id="map14" class="map"></div>
<script>
  (function() {
    const stops = [
      { name: "Mérida Norte", lat: 21.0581, lng: -89.5934, note: "Pool und Laptop", anchor: "pause" }
    ];
    const map = L.map('map14').setView([stops[0].lat, stops[0].lng], 11);
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 18,
      attribution: 'Tiles &copy; Esri &mdash; Source: Esri, HERE, Garmin, USGS, Intermap, NRCan, METI, Esri China (Hong Kong), Esri Korea, Esri (Thailand), NGCC, &copy; OpenStreetMap-Mitwirkende'
    }).addTo(map);
    const latlngs = [];
    stops.forEach(function(stop) {
      const marker = L.marker([stop.lat, stop.lng]).addTo(map);
      marker.bindPopup('<strong>' + stop.name + '</strong><br>' + stop.note + '<br><a href="#' + stop.anchor + '">&#8595; Zum Tagebucheintrag</a>');
      latlngs.push([stop.lat, stop.lng]);
    });
    if (latlngs.length > 1) { L.polyline(latlngs, { color: '#a33', weight: 3, dashArray: '6 6' }).addTo(map); map.fitBounds(latlngs, { padding: [30, 30] }); }
  })();
</script>

<p id="pause"><strong>Pause in Mérida:</strong> Ein Tag ohne Programm: Liege am Pool, kurz der Laptop, abends zusammensitzen. Nach zwei Wochen Rundreise genau richtig.</p>
