<h1>Tag 10 &ndash; Sonntag, 29. Januar &ndash; Tulum: Durchatmen</h1>
<h2 class="map-heading">Karte</h2>
<div id="map10" class="map"></div>
<script>
  (function() {
    const stops = [
      { name: "Aldea Zama, Tulum", lat: 20.2033, lng: -87.4581, note: "Pool und Ruhe", anchor: "ruhe" }
    ];
    const map = L.map('map10').setView([stops[0].lat, stops[0].lng], 11);
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 18,
      attribution: 'Tiles &copy; Esri &mdash; Source: Esri, HERE, Garmin, USGS, Intermap, NRCan, METI, Esri China (Hong Kong), Esri Korea, Esri (Thailand), NGCC, &copy; OpenStreetMap-Mitwirkende'
    }).addTo(map);
    const latlngs = [];
    stops.forEach(function(stop) {
      const marker = L.marker([stop.lat, stop.lng]).addTo(map);
      marker.bindPopup('<strong>' + stop.name + '</strong><br>' + stop.note + '<br><a href="#' + stop.anchor + '">&#8595; Zum Tagebucheintrag</a>');
      latlngs.push([stop.lat, stop.lng]);
    });
    if (latlngs.length > 1) { L.polyline(latlngs, { color: '#a33', weight: 3, dashArray: '6 6' }).addTo(map); map.fitBounds(latlngs, { padding: [30, 30] }); }
  })();
</script>

<p id="ruhe"><strong>Ruhetag:</strong> Nach dem Samstag braucht es genau das: Füße ins Meer, später in den Pool im Innenhof. Kein Programm, keine Uhr.</p>
